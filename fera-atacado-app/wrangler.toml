name = "gest-ovendas"
main = "src/worker.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# ANTES DE PUBLICAR: crie seu banco D1 e substitua o ID abaixo.
[[d1_databases]]
binding = "DB"
database_name = "fera-contatos"
database_id = "SUBSTITUA_PELO_ID_DO_SEU_BANCO_D1"
migrations_dir = "migrations"
